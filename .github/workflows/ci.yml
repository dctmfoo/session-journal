name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit SHA. This repository already SHA-pins the
      # gitleaks tarball below; a mutable tag on an action that can read the
      # workflow token is the weaker link of the two.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: bats-core/bats-action@42fcc8700f773c075a16a90eb11674c0318ad507 # 3.0.1
      - name: Install shellcheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Validate shell syntax
        run: |
          bash -n extras/spine-promotion/journal-spine-promotion-nudge.sh
          bash -n install.sh
          bash -n doctor.sh
      - name: Run shellcheck
        run: shellcheck extras/spine-promotion/*.sh install.sh doctor.sh
      - name: Run the hook scenario tests
        # The runner's python3; the script itself is also checked to parse
        # under the oldest supported interpreter's grammar (3.8).
        run: |
          python3 --version
          python3 -c "import ast; ast.parse(open('hooks/session-journal.py').read(), feature_version=(3, 8))"
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run bats suites
        run: bats tests
      - name: Self-check this repository's own installation
        run: ./doctor.sh .
      - name: Check every tracked journal for credential shapes
        # The hook checks each journal write as it happens; CI re-checks every
        # tracked journal, because older journals are history a reader still
        # trusts. Line numbers and rule names only, never values.
        run: python3 hooks/session-journal.py scan sessions/2*.md

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the full repository history
        run: /tmp/gitleaks detect --source . --log-opts="--all" --redact --no-banner
