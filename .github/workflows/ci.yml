name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit SHA. This repository already SHA-pins the
      # gitleaks tarball below; a mutable tag on an action that can read the
      # workflow token is the weaker link of the two.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: bats-core/bats-action@42fcc8700f773c075a16a90eb11674c0318ad507 # 3.0.1
      - name: Install shellcheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Validate shell syntax
        run: |
          bash -n hooks/session-journal-pointer.sh
          bash -n hooks/session-journal-nudge.sh
          bash -n extras/spine-promotion/journal-spine-promotion-nudge.sh
          bash -n install.sh
          bash -n doctor.sh
      - name: Run shellcheck
        run: shellcheck hooks/*.sh extras/spine-promotion/*.sh install.sh doctor.sh
      - name: Run bats suites
        run: bats tests
      - name: Self-check this repository's own installation
        run: ./doctor.sh .
      - name: Check every tracked journal with the runtime secrets guard
        # The hook deliberately scans only the newest journal, which is the right
        # contract at runtime and the wrong one for a repository-wide gate. Older
        # journals are history a reader still trusts, so CI walks all of them.
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for journal in sessions/*.md; do
            case "$(basename "$journal")" in README.md|TEMPLATE.md) continue ;; esac
            scratch="$(mktemp -d)"
            mkdir -p "$scratch/sessions"
            cp "$journal" "$scratch/sessions/"
            if ! printf '%s' '{"stop_hook_active":false}' \
              | CLAUDE_PROJECT_DIR="$scratch" SESSION_JOURNAL_DIR="$scratch/sessions" \
                JOURNAL_FRESH_SECS=999999999 SESSION_JOURNAL_SKIP=1 \
                hooks/session-journal-nudge.sh >/dev/null; then
              echo "::error file=$journal::secret-shaped content in $journal"
              status=1
            fi
            rm -rf "$scratch"
          done
          exit "$status"

  bash32:
    # The hooks advertise bash 3.2 compatibility -- the version macOS still
    # ships -- and that was the one claim nothing tested. macos-latest runs
    # /bin/bash 3.2, so exercise the suite against it explicitly.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: bats-core/bats-action@42fcc8700f773c075a16a90eb11674c0318ad507 # 3.0.1
      - name: Report the interpreter under test
        run: /bin/bash --version | head -n 1
      - name: Run the suite under /bin/bash 3.2
        run: /bin/bash -c 'bats tests'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the full repository history
        run: /tmp/gitleaks detect --source . --log-opts="--all" --redact --no-banner
